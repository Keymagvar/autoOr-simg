name: Release

# Builds the distributables for Linux and Windows, per DESIGN.md §13.
# Linux gets two: the plain tarball+install.sh and a portable AppImage
# (packaging/linux/build_appimage.sh) — no install step, carries its own
# icon, same "just run it" philosophy as the Windows exe. Both
# cross-compile fine from a plain ubuntu-latest runner (confirmed: cgofuse
# needs cgo on Linux, which ubuntu-latest's default toolchain already
# provides, and needs NO cgo at all on Windows — see
# packaging/windows/build.sh's own comment).
#
# macOS is intentionally not built here for now: it's the one platform
# that needs its own native runner (cgofuse requires real cgo there too,
# and there's no osxcross cross-compile toolchain in this repo), and
# macos-latest runners cost 10x the Actions-minutes multiplier of a
# regular Linux runner on a private repo. packaging/macos/build.sh still
# exists and works (see its own history) — reintroduce a build-macos job
# using it if/when macOS support is actually needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Needed for the release job's softprops/action-gh-release step to actually
# create the GitHub Release and attach files — the default GITHUB_TOKEN is
# read-only unless a repo's own Settings > Actions > General > Workflow
# permissions is set to "Read and write", which isn't guaranteed across
# accounts/orgs. Declaring it here means this works regardless of that
# setting, instead of silently 403ing on the first real release.
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # See test.yml's test-linux job for why libfuse-dev (not just
      # libfuse3-dev) and libturbojpeg0-dev are both needed at build time.
      # See test.yml's test-linux job for why libgtk-3-bin/librsvg2-common
      # are needed (linuxdeploy's GTK plugin, used by build_appimage.sh).
      - run: sudo apt-get update && sudo apt-get install -y libfuse-dev libfuse3-dev libturbojpeg0-dev libayatana-appindicator3-dev libgtk-3-bin librsvg2-common
      - name: Build
        run: VERSION="${{ github.ref_name }}" bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autoOr-simg-linux-amd64
          path: dist/autoOr-simg-linux-amd64.tar.gz
      - name: Build AppImage (portable, no install step)
        run: VERSION="${{ github.ref_name }}" bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autoOr-simg-linux-x86_64-appimage
          path: dist/autoOr-simg-x86_64.AppImage

  build-windows:
    # Deliberately ubuntu-latest, not windows-latest: the current build is
    # a CGO_ENABLED=0 cross-compile from Linux (proven to work end-to-end,
    # including under Wine, this session), not a native build. Move this
    # to windows-latest once the accelerated cgo codec path gets a real
    # Windows libjpeg-turbo lib vendored (DESIGN.md §13) and needs an
    # actual mingw-w64/MSVC toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: VERSION="${{ github.ref_name }}" bash packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autoOr-simg-windows-amd64
          path: dist/autoOr-simg-windows-amd64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: true
